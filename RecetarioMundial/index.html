<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recetas fáciles de diferentes países">
  <title>RECETAS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" id="homeLink"><span class="brand-icon">♨</span><span><strong>RECETAS JDAB</strong><small>Encuentra recetas fáciles de diferentes países.</small></span></a>
      <nav class="main-nav">
        <button class="nav-button active" id="navHome">⌂ <span>Inicio</span></button>
        <button class="nav-button" id="navFavorites">♡ <span>Favoritos</span> <b id="favoriteCount">0</b></button>
        <button class="nav-button" id="navRandom">⚄ <span>Receta aleatoria</span></button>
      </nav>
    </div>
  </header>
  <main class="container">
    <form class="search-panel" id="searchForm">
      <label for="searchInput">Buscar una receta</label>
      <div class="search-row"><input id="searchInput" type="search" placeholder="Ej. pasta, pollo..." autocomplete="off"><button class="button primary" type="submit">Buscar</button></div>
    </form>
    <section class="section"><h2>Categorías</h2><div class="category-list" id="categoryList"></div></section>
    <section class="section"><h2 id="resultsTitle">Recetas</h2><p id="resultsEyebrow" class="muted"></p><p id="statusMessage" class="status-message" role="status">Cargando recetas...</p><div class="recipe-grid" id="recipeGrid"></div></section>
  </main>
  <footer class="site-footer"><nav><button id="footerHome">⌂ Inicio</button><span>|</span><button id="footerFavorites">♡ Favoritos</button><span>|</span><button id="footerRandom">⚄ Receta aleatoria</button></nav><p>REcetas JDAB · Recetas proporcionadas por TheMealDB</p></footer>
  <dialog id="recipeDialog" class="recipe-dialog"><button class="dialog-close" id="dialogClose" aria-label="Cerrar">×</button><div id="dialogContent"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
